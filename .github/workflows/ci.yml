name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          PUBLIC_IS_WEB: ${{ secrets.PUBLIC_IS_WEB }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: npm run build

  rust:
    name: Rust Checks
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: crates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            lld \
            clang \
            rpm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./crates -> target"

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test
