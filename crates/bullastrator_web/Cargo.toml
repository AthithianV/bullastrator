[package]
name = "bullastrator-web"
version = "0.1.0"
description = "Bullastrator Web - API layer."
authors = ["Athithian"]
edition = "2021"


[lib]
name = "bullastrator_web"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }

bullastrator-core = { path = "../bullastrator_core" }
bullastrator-storage = { path = "../bullastrator_storage" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
