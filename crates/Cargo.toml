[workspace]
resolver = "2"

members = [
  "bullastrator_core",
  "bullastrator_web",
  "bullastrator_storage",
  "bullastrator_cli",
  "bullastrator_desktop",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum_macros = "0.26"

chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "chrono", "macros"] }
uuid = { version = "1.2", features = ["v4", "serde"] }

tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

anyhow = "1.0.100"
aes-gcm = "0.10"
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
rand = "0.8.5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

dirs-next = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
