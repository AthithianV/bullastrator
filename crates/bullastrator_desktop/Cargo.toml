[package]
name = "bullastrator-desktop"
version = "0.2.1"
description = "Bullastrator Desktop - Desktop Version of Bullastrator Web."
authors = ["Athithian"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bullastrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-fs = "=2.7.0"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-log = "=2.10.1"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-http = "=2.8.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-os = "=2.4.0"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.13.3"
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.3", features = ["deep-link"] }

serde = { workspace = true }
serde_json = { workspace = true }

bullastrator-core = { path = "../bullastrator_core" }
bullastrator-storage = { path = "../bullastrator_storage" }
