[package]
name = "bullastrator-core"
version = "0.1.0"
description = "Bullastrator - Layer when redis queues are accessed."
authors = ["Athithian"]
edition = "2021"


[lib]
name = "bullastrator_core"

[dependencies]
sha2 = "0.10.9"
argon2 = "0.5"
rand = "0.8.5"
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = "1.3.1"
tokio = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = "2"

bullastrator-storage = { path = "../bullastrator_storage" }
bullmq = { package = "bullmq-official", version = "1.3.3" }

sqlx = { workspace = true }
redis = { version = "0.32.7", features = ["tokio-comp", "aio", "tokio-native-tls-comp"] }
deadpool-redis = { version = "0.22.1",features = ["rt_tokio_1", "tokio-native-tls-comp"] }

url = "2.5.7"
semver = "1.0"
hex = "0.4.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
