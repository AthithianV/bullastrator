[package]
name = "bullastrator-storage"
version = "0.1.0"
description = "Bullastrator - Layer when redis queues are accessed."
authors = ["Athithian"]
edition = "2021"


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bullastrator_storage"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

machine-uid = "0.5"
sha2 = "0.10.9"
aes-gcm = "0.10.3"
rand = "0.8.5"

log = "0.4"

regex = "1.12.2"
dirs-next = "2.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3.1"

strum = "0.26"
strum_macros = "0.26"
tokio = "1.47.1"
reqwest = { version = "0.12", features = ["json"] }

thiserror = "1.0"
anyhow = "1.0.100"
tracing-subscriber = "0.3.20"
tracing = "0.1.41"

uuid = { version = "1.2", features = ["v4", "serde"] }
sea-orm = { version = "1.1.12", features = [
    "sqlx-sqlite",
    "macros",
    "runtime-tokio-native-tls",
    "with-uuid"
] }

redis = { version = "0.32.7", features = ["tokio-comp", "aio", "tokio-native-tls-comp"] }
deadpool-redis = { version = "0.22.1",features = ["rt_tokio_1", "tokio-native-tls-comp"] }

chrono = { version = "0.4", features = ["serde"] }
url = "2.5.7"
semver = "1.0"
hex = "0.4.3"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
