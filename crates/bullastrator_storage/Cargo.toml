[package]
name = "bullastrator-storage"
version = "0.1.0"
description = "Bullastrator - Layer when redis queues are accessed."
authors = ["Athithian"]
edition = "2021"


[lib]
name = "bullastrator_storage"

[dependencies]
serde = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
